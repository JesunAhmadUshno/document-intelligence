name: Pages

# Builds the live dashboard in site/ from results/ and README.md, PROPOSAL.md and REPORT.md, and publishes it to GitHub Pages at /document-intelligence/.
# "npm run build" first runs src/parity.check.mjs, so a browser port that drifts from
# the committed results fails the deploy.
# Pages must be set to build_type=workflow (it was a legacy build from main:/docs,
# which only held a short text summary; docs/index.md stays in the repo).
on:
  push:
    branches: [main]
    paths: ['site/**', 'results/**', 'README.md', 'PROPOSAL.md', 'REPORT.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
